; php artisan serve is single-threaded, so every millisecond of per-request
; PHP bootstrap cost (recompiling the whole framework from source) is fully
; serialized across every visitor. This is the single biggest lever available
; without changing the server itself.
opcache.enable=1
opcache.enable_cli=0
opcache.jit=tracing
opcache.jit_buffer_size=64M
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Container images are immutable per deploy (a new build replaces the whole
; filesystem), so skip the per-request mtime check entirely.
opcache.validate_timestamps=0
